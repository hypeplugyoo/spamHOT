services:
  web:
    build: { context: ., target: web }
    command: npm run dev
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://publisher:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/publisher?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: [".:/app", "/app/node_modules"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, minio: { condition: service_started } }
  worker:
    build: { context: ., target: worker }
    command: npm run worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://publisher:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/publisher?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: [".:/app", "/app/node_modules"]
    shm_size: 1gb
    init: true
    stop_grace_period: 30s
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, minio: { condition: service_started } }
  session:
    build: { context: ., target: session }
    command: npm run session
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:3333:3333"]
    volumes: [".:/app", "/app/node_modules"]
    shm_size: 1gb
    init: true
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: publisher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: publisher
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U publisher -d publisher"], interval: 5s, timeout: 5s, retries: 15 }
  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 15 }
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
volumes:
  postgres_data:
  redis_data:
  minio_data:
